[package]
name        = "nannyd"
description = "Nanny — execution boundary for AI agents. CLI (nanny run) and Rust SDK (#[tool], #[rule], #[agent])."
readme       = "../../README.md"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[[bin]]
name = "nanny"
path = "src/main.rs"

[lib]
name = "nanny"
path = "src/lib.rs"

[dependencies]
nanny-core    = { workspace = true }
nanny-config  = { workspace = true }
nanny-runtime = { workspace = true }
nanny-bridge  = { workspace = true }
nanny-macros  = { workspace = true }
inventory    = "0.3"
anyhow       = { workspace = true }
clap         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
shlex        = "1"
toml_edit    = { workspace = true }
sha2         = { workspace = true }
# v0.2.0 — Network Bridge
reqwest      = { workspace = true }
rcgen        = { workspace = true }
notify       = { workspace = true }
dirs         = { workspace = true }
x509-parser  = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true }
base64       = { workspace = true }
toml         = { workspace = true }
# SIGINT/SIGTERM handling for `nanny run --serve`'s governor+child cleanup.
ctrlc        = { version = "3.5.2", features = ["termination"] }
# `run_scope_async`: task-local run ids for agents on a Tokio runtime. Already
# an unconditional transitive dependency via nanny-bridge, so this is free.
tokio        = { workspace = true }

[target.'cfg(windows)'.dependencies]
self-replace = "1"

[dev-dependencies]
nanny-bridge   = { workspace = true }
nanny-core     = { workspace = true }
nanny-runtime  = { workspace = true }
