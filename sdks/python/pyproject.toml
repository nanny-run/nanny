[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanny-sdk"
version = "0.6.0"
description = "Python SDK for Nanny, the authorization and audit layer for AI agents. @tool, @rule, @agent decorators"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpserver>=1.1.5",
    "ruff>=0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["nanny_sdk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
