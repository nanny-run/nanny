name: Security audit

# Complements dependency-review.yml, which only checks a PR's own diff.
# This checks the FULL current state of every dependency already merged,
# on a schedule — the only way to catch a new CVE published against a
# dependency nobody has touched since it was pinned. This is expected to
# start failing periodically for reasons unrelated to any recent change;
# that's the mechanism working, not a false alarm.
#
# Shipped code (root Cargo.lock, sdks/python) hard-fails on open
# critical/high alerts. examples/** is reported, not blocking: nothing
# under examples/ is installed by a real user, and gating a release on a
# demo app's dependency tree would be disproportionate. Revisit this split
# if examples/ is ever distributed rather than run-from-source.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily; arbitrary offset to avoid the top-of-hour thundering herd
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: read

jobs:
  audit-shipped:
    name: Shipped code — fail on open critical/high alerts
    runs-on: ubuntu-latest
    steps:
      - name: Query open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ALERTS=$(gh api "repos/${{ github.repository }}/dependabot/alerts" --paginate \
            -q '.[] | select(.state=="open")
                 | select(.security_vulnerability.severity=="critical" or .security_vulnerability.severity=="high")
                 | select(.dependency.manifest_path | startswith("examples/") | not)
                 | "\(.security_vulnerability.severity)\t\(.dependency.manifest_path)\t\(.dependency.package.ecosystem)/\(.dependency.package.name)\t\(.html_url)"')
          if [ -n "$ALERTS" ]; then
            echo "Open critical/high alerts on shipped code:"
            echo "$ALERTS" | column -t -s $'\t'
            echo ""
            echo "Fix (bump the dependency) or explicitly accept via 'dismiss' with a reason at:"
            echo "https://github.com/${{ github.repository }}/security/dependabot"
            exit 1
          fi
          echo "No open critical/high alerts on shipped code."

  audit-examples:
    name: Examples — report only, non-blocking
    runs-on: ubuntu-latest
    steps:
      - name: Query open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ALERTS=$(gh api "repos/${{ github.repository }}/dependabot/alerts" --paginate \
            -q '.[] | select(.state=="open")
                 | select(.security_vulnerability.severity=="critical" or .security_vulnerability.severity=="high")
                 | select(.dependency.manifest_path | startswith("examples/"))
                 | "\(.security_vulnerability.severity)\t\(.dependency.manifest_path)\t\(.dependency.package.ecosystem)/\(.dependency.package.name)"')
          if [ -n "$ALERTS" ]; then
            echo "::warning::Open critical/high alerts in examples/ (not blocking):"
            echo "$ALERTS" | column -t -s $'\t'
          else
            echo "No open critical/high alerts in examples/."
          fi
