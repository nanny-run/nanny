name: Security audit

# Complements dependency-review.yml, which only checks a PR's own diff.
# This checks the FULL current state of every dependency already merged,
# on push to main AND on a schedule — the schedule is what catches a new
# CVE published against a dependency nobody has touched since it was
# pinned; the push trigger is what re-confirms a fix immediately after it
# merges, instead of waiting for tomorrow's cron. This is expected to start
# failing periodically for reasons unrelated to any recent change; that's
# the mechanism working, not a false alarm.
#
# The gate retries a few times, a short wait apart, before actually
# failing: GitHub's own alert index takes some short, variable time to
# re-scan after a push, so a check that runs seconds after a fix merges can
# still see the now-fixed alert as briefly "open." There is no API to force
# that re-scan faster; retrying within this run is what's actually
# controllable, shrinking the visible lag from "up to a day" (waiting for
# the next cron) to "up to about a minute."
#
# Shipped code (root Cargo.lock, sdks/python) hard-fails on open
# critical/high alerts, UNLESS covered by an active, non-expired entry in
# .security-allowlist.jsonc — see that file's header. examples/** is
# reported, not blocking: nothing under examples/ is installed by a real
# user, and gating a release on a demo app's dependency tree would be
# disproportionate. See cloud/IMPLEMENTATION_PLAN.md's "Future: remove
# examples/" note — that decision, once acted on, removes this split
# entirely rather than needing the allowlist extended to cover it.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily; arbitrary offset to avoid the top-of-hour thundering herd
  workflow_dispatch: {}

permissions:
  contents: read

# GITHUB_TOKEN (github.token) cannot read /dependabot/alerts under any grant
# in the `permissions:` block above — that endpoint isn't available to the
# Actions-generated token at all, regardless of scope requested.
# `security-events` (which used to be here) is for the Code Scanning API,
# a different endpoint; it never actually granted this. A fine-grained PAT
# with the repo's "Dependabot alerts: Read-only" permission, stored as the
# DEPENDABOT_ALERTS_TOKEN secret, is required instead. Confirmed the hard
# way: this workflow ran green locally under a personal `gh auth` session
# throughout development, then failed with "Resource not accessible by
# integration" the first time it actually ran in Actions.

jobs:
  TEMP-diagnostic-does-homebrew-tap-token-work:
    name: "TEMP: test whether HOMEBREW_TAP_TOKEN can read Dependabot alerts"
    runs-on: ubuntu-latest
    steps:
      - name: Try it
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/dependabot/alerts" --paginate > /dev/null \
            && echo "WORKS: HOMEBREW_TAP_TOKEN can read Dependabot alerts" \
            || echo "DOES NOT WORK: same 403 as GITHUB_TOKEN"

  audit-shipped:
    name: Shipped code — fail on open critical/high alerts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate .security-allowlist.jsonc
        run: python3 scripts/check_security_allowlist.py

      - name: Check DEPENDABOT_ALERTS_TOKEN is configured
        run: |
          if [ -z "${{ secrets.DEPENDABOT_ALERTS_TOKEN }}" ]; then
            echo "::error::DEPENDABOT_ALERTS_TOKEN secret is not set. This workflow needs a" \
                 "fine-grained PAT with 'Dependabot alerts: Read-only' on this repo — GITHUB_TOKEN" \
                 "cannot read that API under any permission grant. See this workflow's own header."
            exit 1
          fi

      - name: Query open Dependabot alerts and gate on unallowlisted findings
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          set -euo pipefail
          attempts=4
          delay=15
          for i in $(seq 1 "$attempts"); do
            if gh api "repos/${{ github.repository }}/dependabot/alerts" --paginate --slurp \
                | python3 scripts/security_audit_gate.py --scope shipped; then
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo ""
              echo "Attempt $i/$attempts failed — this can be GitHub's alert index still catching up"
              echo "with a fix that just merged, not necessarily a real finding. Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo ""
          echo "Still failing after $attempts attempts — treating as a real finding, not a race."
          exit 1

  audit-examples:
    name: Examples — report only, non-blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Query open Dependabot alerts (informational)
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DEPENDABOT_ALERTS_TOKEN secret is not set — skipping (see audit-shipped job)."
            exit 0
          fi
          gh api "repos/${{ github.repository }}/dependabot/alerts" --paginate --slurp \
            | python3 scripts/security_audit_gate.py --scope examples
